<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AttachOnce</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { width: 250px; margin: 0; padding: 18px; background: #11100d; color: #fff6e5; }
      .eyebrow { margin: 0 0 7px; color: #ffb45d; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 14px; color: #d6c8b4; line-height: 1.45; }
      button { width: 100%; padding: 10px 12px; border: 1px solid #ffcc8d; border-radius: 10px; background: #ffb45d; color: #211407; font: inherit; font-weight: 800; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; }
      #status { min-height: 20px; margin-top: 12px; color: #9fe0b2; font-size: 12px; }
    </style>
  </head>
  <body>
    <p class="eyebrow">one file · one tab · one time</p>
    <h1>AttachOnce</h1>
    <p>Enable the in-page picker on this tab. It forgets the file after one native attachment.</p>
    <button id="enable" type="button">Enable on this tab</button>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
